<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<style>
:root{--bg1:#c8102e;--bg2:#1a0b0e;--card:#fff;--ink:#2a1a1d;--red:#c8102e;--pink:#ff8fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#a50d26;--bg2:#0e0507}}
:root[data-theme="dark"]{--bg1:#a50d26;--bg2:#0e0507}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);overflow:hidden;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.heart{position:fixed;bottom:-30px;color:var(--pink);opacity:.7;pointer-events:none;animation:up 6s linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.env{position:relative;margin:auto;flex:none;width:min(300px,80vw);height:200px;border:0;padding:0;background:none;cursor:pointer;perspective:700px;transition:opacity .5s,transform .5s}
.env .body{position:absolute;inset:0;background:#2b0f14;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.env .flap{position:absolute;left:0;right:0;top:0;height:110px;background:#4a1119;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s}
.env .seal{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-size:34px;color:var(--pink);z-index:2;animation:beat 1.2s infinite}
.env .hint{position:absolute;left:0;right:0;bottom:16px;color:#ffd5db;font-size:15px}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{display:none}
.env.gone{position:absolute;opacity:0;transform:scale(.8);pointer-events:none}
@keyframes beat{50%{transform:translateX(-50%) scale(1.2)}}
.card{display:none;flex:none;width:min(360px,92vw);max-height:100%;overflow-y:auto;margin:auto;background:var(--card);border-radius:22px;padding:22px 22px 18px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.55);border:3px solid var(--red);position:relative}
.card.show{display:block;animation:pop .5s}
@keyframes pop{from{transform:translateY(40px) scale(.9);opacity:0}}
.pic{height:min(300px,38vh);display:flex;align-items:center;justify-content:center}
.pic img{max-height:100%;max-width:100%;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{margin:10px 0 6px;font-size:24px;color:var(--red);letter-spacing:.5px}
p{margin:0 0 14px;font-size:16.5px;line-height:1.45}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:48px}
button.b{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 22px;background:var(--red);color:#fff;cursor:pointer;transition:transform .2s}
button.b.alt{background:#2a1a1d}
button.b:active{transform:scale(.95)}
.dots{margin-top:12px;color:#d9c3c6;font-size:12px;letter-spacing:6px}
.dots i{font-style:normal}.dots i.on{color:var(--red)}
.fade{animation:pop .4s}
</style></head><body>
<button class="env" id="env" aria-label="Abrir carta"><div class="body"></div><div class="flap"></div><div class="seal">♥</div><div class="hint">Toca para abrir</div></button>
<div class="card" id="card">
  <div class="pic"><img id="img" alt=""></div>
  <h1 id="t"></h1><p id="x"></p>
  <div class="row" id="row"></div>
  <div class="dots" id="dots"></div>
</div>

var n=0,tries=0;
function $(i){return document.getElementById(i)}
function spawn(){var h=document.createElement("div");h.className="heart";h.textContent="♥";h.style.left=Math.random()*100+"vw";h.style.fontSize=(14+Math.random()*22)+"px";document.body.appendChild(h);setTimeout(function(){h.remove()},6000)}
setInterval(spawn,700);
function burst(){for(var k=0;k<24;k++)setTimeout(spawn,k*60)}
function render(){
  var s=S[n];$("img").src=IMG[s.i];$("t").textContent=s.t;$("x").textContent=s.x;
  var r=$("row");r.innerHTML="";
  if(n<S.length-1){var b=document.createElement("button");b.className="b";b.textContent="Siguiente ›";b.onclick=function(){n++;render()};r.appendChild(b)}
